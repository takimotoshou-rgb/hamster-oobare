<!doctype html>
<html lang="ja">
<head>

<title>ハムスター大暴れ（仮）</title>
<style>
:root{--ink:#4d2b26;--pink:#ff7ea0;--yellow:#ffdb3a;--violet:#9d7df0;--paper:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a1424;overflow:hidden;overscroll-behavior:none;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game{display:block;background:#1a1424;cursor:none}
#game.menu{cursor:default}
.outlined{color:#fff;paint-order:stroke fill;-webkit-text-stroke:.16em var(--ink);text-shadow:0 .06em 0 var(--ink)}
/* ---- menu ---- */
#menu{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:1.1vh;
  background:linear-gradient(180deg,#ffb3d1 0%,#9f80f2 100%);overflow:hidden;padding:2vh 3vw;text-align:center}
#menu.on{display:flex}
#menu .dots{position:absolute;inset:0;pointer-events:none}
#menu .dots i{position:absolute;border-radius:50%;background:rgba(255,255,255,.22)}
#menu h1{margin:0;font-size:min(9vw,8.5vh);line-height:1.05;color:var(--yellow);
  paint-order:stroke fill;-webkit-text-stroke:.22em #c03466;animation:bob 1.9s ease-in-out infinite;position:relative}
@keyframes bob{0%,100%{transform:scale(1,1) rotate(-.7deg)}50%{transform:scale(1.03,.97) rotate(.7deg)}}
#menu .sub{font-size:min(3.2vw,3vh);margin:0}
#menu h2{margin:1.2vh 0 0;font-size:min(3.6vw,3.6vh)}
.row{display:flex;flex-wrap:wrap;gap:1.4vh 1.2vw;justify-content:center;position:relative}
.opt{font:inherit;font-weight:700;font-size:min(3.4vw,3.4vh);min-width:min(26vw,20vh*1.5);padding:.55em 1em;border-radius:999px;
  border:.18em solid #8c59c0;background:rgba(255,255,255,.9);color:#6a3590;cursor:pointer;transition:transform .08s}
.opt:hover{transform:translateY(-2px) scale(1.03);background:#fff}
.opt.sel{background:var(--yellow);border-color:var(--ink);color:#4d2b26}
.opt:focus-visible,.go:focus-visible,.btn:focus-visible{outline:.2em solid #fff;outline-offset:.15em}
.desc{min-height:1.5em;font-size:min(2.7vw,2.7vh);margin:0;max-width:92vw}
.go{font:inherit;font-weight:800;font-size:min(5vw,5vh);padding:.4em 1.9em;border-radius:999px;border:.14em solid #ffe94a;
  background:var(--pink);color:#fff;cursor:pointer;margin-top:1.2vh;paint-order:stroke fill;-webkit-text-stroke:.18em #993057;
  box-shadow:0 .2em 0 #c9406f}
.go:hover{filter:brightness(1.07);transform:translateY(-2px)}
.go:active{transform:translateY(2px);box-shadow:0 .08em 0 #c9406f}
.keys{font-size:min(2.2vw,2.2vh);opacity:.92;margin:0}
.pv{position:absolute;top:2vh;width:min(22vw,24vh);height:min(22vw,24vh);pointer-events:none}
.pv.l{left:2vw}.pv.r{right:2vw}
/* ---- HUD overlay buttons ---- */
#dash{position:fixed;right:max(3vw,env(safe-area-inset-right));bottom:max(4vh,env(safe-area-inset-bottom));width:min(26vw,30vh);height:min(26vw,30vh);

#dash.down{background:#ffd23a;transform:scale(.95)}

body.play #back,body.play #plane{display:block}
#plane{position:fixed;left:max(1vw,env(safe-area-inset-left));bottom:calc(max(1.2vh,env(safe-area-inset-bottom)) + 9vh);display:none;z-index:5;font:inherit;font-weight:700;font-size:min(3vw,3vh);padding:.3em .9em;border-radius:999px;border:.14em solid #fff;background:rgba(255,126,160,.85);color:#fff;cursor:pointer;touch-action:manipulation}
body.touch.play #dash{display:none}

#result{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:6;background:rgba(40,20,70,.45)}

#result .card{background:#fff;border:.6vmin solid var(--ink);border-radius:4vmin;padding:4vmin 6vmin;text-align:center;box-shadow:0 1vmin 0 rgba(0,0,0,.25);

#result .big{font-size:min(9vw,9vh);font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
#result .best{font-size:min(3.6vw,3.6vh);color:#6a3590;margin:.5vmin 0 2vmin;font-weight:700}
#result .btns{display:flex;gap:2vmin;justify-content:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;font-size:min(4vw,4vh);padding:.45em 1.2em;border-radius:999px;border:.14em solid var(--ink);cursor:pointer;background:var(--yellow);color:var(--ink)}
.btn.alt{background:#fff}
@media (prefers-reduced-motion:reduce){#menu h1{animation:none}.opt,.go{transition:none}}
</style>
</head>

const rgba = (c, a = 1) => `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${a})`;
const dk = (c, a) => [c[0] * (1 - a), c[1] * (1 - a), c[2] * (1 - a)];

const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const sgn = v => v < 0 ? -1 : 1;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function seeded(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- 描画ヘルパー ---------- */
function disc(g, x, y, r, c, a = 1) { g.fillStyle = rgba(c, a); g.beginPath(); g.arc(x, y, Math.max(r, 0), 0, 6.2832); g.fill(); }
function odisc(g, x, y, r, c, w = 3) { disc(g, x, y, r + w, OL); disc(g, x, y, r, c); }
function ell(g, x, y, rx, ry, c, a = 1) { g.fillStyle = rgba(c, a); g.beginPath(); g.ellipse(x, y, Math.max(rx, 0), Math.max(ry, 0), 0, 0, 6.2832); g.fill(); }
function ln(g, x1, y1, x2, y2, c, w, a = 1) { g.strokeStyle = rgba(c, a); g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function arc(g, x, y, r, a0, a1, c, w, a = 1) { g.strokeStyle = rgba(c, a); g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.arc(x, y, Math.max(r, 0), a0, a1); g.stroke(); }
function rrect(g, x, y, w, h, r, fill, stroke, sw = 2, fa = 1) {
  g.beginPath(); g.roundRect(x, y, w, h, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  if (fill) { g.fillStyle = rgba(fill, fa); g.fill(); }
  if (stroke) { g.strokeStyle = rgba(stroke); g.lineWidth = sw; g.lineJoin = 'round'; g.stroke(); }
}
/* 部屋用：自分の色を暗くした輪郭 */
function box(g, x, y, w, h, c, r = 8, bw = 2) { rrect(g, x, y, w, h, r, c, dk(c, 0.45), bw); }
function circ(g, x, y, r, c, w = 2) { disc(g, x, y, r + w, dk(c, 0.45)); disc(g, x, y, r, c); }
function poly(g, pts, fill, stroke, sw = 2, fa = 1) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath();
  if (fill) { g.fillStyle = rgba(fill, fa); g.fill(); }
  if (stroke) { g.strokeStyle = rgba(stroke); g.lineWidth = sw; g.lineJoin = 'round'; g.stroke(); }
}
function polyline(g, pts, c, w, a = 1) { g.strokeStyle = rgba(c, a); g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.stroke(); }
function textOL(g, s, x, y, size, fill, outline, ow, align = 'center') {

}

/* ---------- 効果音（WebAudioで生成。ファイル不使用） ---------- */

  const mk = (row, desc, data, key, descKey) => {
    const el = $(row); el.innerHTML = '';
    for (const id of Object.keys(data)) {
      const b = document.createElement('button'); b.className = 'opt' + (sel[key] === id ? ' sel' : ''); b.textContent = data[id].name; b.dataset.id = id;
      b.onclick = () => { sel[key] = id; try { localStorage.setItem('hamster.sel', JSON.stringify(sel)); } catch (e) {} Sfx.init(); Sfx.play('ui', .6); refresh(); };
      el.appendChild(b);
    }
  };
  function refresh() {
    mk('rowMode', 'dMode', MODES, 'mode'); mk('rowStage', 'dStage', STAGES, 'stage'); mk('rowHam', 'dHam', HAMSTERS, 'ham');
    $('dMode').textContent = MODES[sel.mode].desc; $('dStage').textContent = STAGES[sel.stage].desc; $('dHam').textContent = HAMSTERS[sel.ham].desc;
    for (const p of previews) p.setup(HAMSTERS[sel.ham]);
    for (const p of previews) { p.fixedR = 78; p.omega = 0; }
  }
  window.__refreshMenu = refresh; refresh();
}
const previews = [new Hamster(HAMSTERS[sel.ham]), new Hamster(HAMSTERS[sel.ham])];
for (const p of previews) { p.cx = 160; p.cy = 190; p.fixedR = 78; p.max_omega = 9; p.place(160, 190); }
function menuFrame(dt) {
  [[$('pvL'), previews[0], 1], [$('pvR'), previews[1], -1]].forEach(([cv, h, dir]) => {
    const g = cv.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
    h.step(dt, dir, 160, 190); h.update(dt); h.draw(g);
    const lvl = h.spinLevel(); if (lvl > .3) arc(g, 160, 190, 78, h.angle - dir * 1.4, h.angle, [1,.85,.5], 14, .4);
  });
}
$('goBtn').onclick = () => { Sfx.init(); Sfx.play('ui'); startGame(); };
buildMenu();
canvas.classList.add('menu');

/* ---------- メインループ ---------- */
let lastT = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min((now - lastT) / 1000, .05); lastT = now;
  if (state === 'menu' || !G) menuFrame(dt);
  else { acc += dt; let n = 0; while (acc >= STEP && n < 8) { update(STEP); acc -= STEP; n++; } if (n >= 8) acc = 0; render(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__hamster = {start(mode, stage, ham) { if (mode) sel.mode = mode; if (stage) sel.stage = stage; if (ham) sel.ham = ham; startGame(); }, get G() { return G; }, get state() { return state; }, inp, sel};
</script>
